<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#dff3ff">
<title>EMOJI DROP! - Draw. Bounce. Drop.</title>
<style>
  /* CSS is used ONLY for page layout / responsive presentation. All game graphics are drawn on the canvas. */
  html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(160deg,#d9f0ff,#fde9ff);
    font-family:'Trebuchet MS','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;left:0;top:0;bottom:0;right:0;display:flex;align-items:center;justify-content:center}
  #game{touch-action:none;display:block;box-shadow:0 12px 60px rgba(70,100,170,.28);background:#fff;outline:none}
  #err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#fff;color:#2b3a67;text-align:center;padding:24px;z-index:20;font-size:18px}
  #ed{display:none;position:fixed;right:0;top:0;bottom:0;width:320px;overflow:auto;background:#f7fbff;border-left:2px solid #bcd7ff;padding:10px;box-sizing:border-box;font-size:13px;color:#22305a;z-index:10;-webkit-user-select:text;user-select:text}
  #ed h3{margin:8px 0 4px;font-size:14px;color:#3b5bdb}
  #ed button,#ed select,#ed input,#ed textarea{font:inherit;font-size:12px;border:1px solid #9db8e8;border-radius:8px;padding:5px 8px;margin:2px;background:#fff;color:#22305a}
  #ed button{cursor:pointer;background:#e7f0ff}
  #ed button:hover{background:#cfe2ff}
  #ed .row{display:flex;flex-wrap:wrap;align-items:center}
  #ed .pal button{cursor:grab}
  #ed label{display:inline-flex;align-items:center;gap:4px;margin:2px 6px 2px 0}
  #ed input[type=number]{width:70px}
  #ed textarea{width:96%;height:110px;font-family:monospace;font-size:11px}
  #ed pre{white-space:pre-wrap;font-size:11px;max-height:160px;overflow:auto;background:#fff;border:1px solid #cfe0ff;border-radius:8px;padding:6px}

/* ---------- LEVEL VALIDATION & AUTOMATED TESTING ---------- */
function validateDef(def){
  const iss=[];
  if(!Array.isArray(def.ball)||!isFinite(def.ball[0])||!isFinite(def.ball[1]))iss.push('Ball start position is missing');
  else if(def.ball[0]<BR||def.ball[0]>W-BR||def.ball[1]>H)iss.push('Ball starts outside the playfield');
  if(!def.target||!CONT[def.target.type])iss.push('Target container is missing');
  else if(!(def.target.x>0&&def.target.x<W&&def.target.y>100&&def.target.y<=H+10))iss.push('Container is outside the playfield');
  if(!Array.isArray(def.ink)||!(def.ink[0]>0))iss.push('Ink budget must be positive');
  if(!def.pens||!def.pens.length||def.pens.some(p=>!PEN[p]))iss.push('Pen list is invalid');
  (def.objs||[]).forEach((o,i)=>{if(!LIB[o.t])iss.push('Object '+i+': unknown type "'+o.t+'"');else if(!isFinite(o.x)||!isFinite(o.y))iss.push('Object '+i+': invalid position');

function* hintCands(def){
  const bx=def.ball[0],by=def.ball[1],tx=def.target.x,ty=def.target.y,sx=tx>=bx?1:-1,dg=Math.PI/180,P=(x,y)=>[Math.round(x),Math.round(y)];
  for(const dir of [sx,-sx])for(const oy of [40,100,180,300])for(const ox of [-50,0])for(const a of [10,18,28,40,55])for(const L of [160,260,380,520]){const x0=bx+ox,y0=by+oy;yield [P(x0,y0),P(x0+dir*Math.cos(a*dg)*L,y0+Math.sin(a*dg)*L)];}
  for(const oy of [60,160])for(const a1 of [15,35])for(const a2 of [0,-15,30])for(const L1 of [120,220])for(const L2 of [160,300]){const x0=bx-20,y0=by+oy,x1=x0+sx*Math.cos(a1*dg)*L1,y1=y0+Math.sin(a1*dg)*L1;yield [P(x0,y0),P(x1,y1),P(x1+sx*Math.cos(a2*dg)*L2,y1+Math.sin(a2*dg)*L2)];}
  for(let k=0;k<500;k++){let x=bx+rnd(-90,50),y=by+rnd(36,320);const pts=[P(x,y)],n=2+(Math.random()*2|0);for(let m=0;m<n;m++){const ang=Math.atan2(ty-y,tx-x)+rnd(-.9,.9),len=rnd(80,280);x+=Math.cos(ang)*len;y+=Math.max(-40,Math.sin(ang)*len);pts.push(P(x,y));}yield pts;}
}
function simWin(def,pts){const sc=new Scene(def,{headless:true});try{for(let w=Math.random()*90|0;w>0;w--)sc.step(16.67);if(!sc.addStroke('rigid',pts,THICK[1].v))return false;sc.drop();for(let i=0;i<300&&sc.state==='running';i++)sc.step(16.67);return sc.state==='won';}catch(e){return false;}finally{sc.dispose();}}
function densePts(p){const o=[];for(let i=0;i<p.length-1;i++){const a=p[i],q=p[i+1],n=Math.max(1,Math.round(Math.hypot(q[0]-a[0],q[1]-a[1])/9));for(let k=0;k<n;k++)o.push([a[0]+(q[0]-a[0])*k/n,a[1]+(q[1]-a[1])*k/n]);}o.push(p[p.length-1]);return o;}
function trySolution(def,pts){
  if(!simWin(def,pts))return false;
  for(const v of [[12,0],[-12,0],[0,12],[0,-12],[8,8],[-8,-8]]){const q=densePts(pts).map(p=>[p[0]+v[0]+rnd(-1.5,1.5),p[1]+v[1]+rnd(-1.5,1.5)]);if(!simWin(def,q))return false;}
  return true;}
function solveLevel(def,done,cap){
  let probe,obs,gen,t0=performance.now();
  try{probe=new Scene(def,{headless:true});obs=probe.obst();gen=hintCands(def);}catch(e){done(null);return;}
  const valid=pts=>{let len=0;for(let i=0;i<pts.length;i++){const p=pts[i];if(p[0]<4||p[0]>W-4||p[1]<-OY||p[1]>H-4)return false;if(i){const q=pts[i-1],d=Math.hypot(p[0]-q[0],p[1]-q[1]);len+=d;const n=Math.ceil(d/8);for(let k=1;k<=n;k++)if(probe.blocked(q[0]+(p[0]-q[0])*k/n,q[1]+(p[1]-q[1])*k/n,THICK[1].v,obs))return false;}else if(probe.blocked(p[0],p[1],THICK[1].v,obs))return false;}return len<=def.ink[0]*.98&&len>40;};
  (function chunk(){if(G.ytPaused){setTimeout(chunk,250);return;}const t=performance.now();
    try{while(performance.now()-t<10){const r=gen.next();if(r.done||performance.now()-t0>(cap||25000)){probe.dispose();done(null);return;}if(valid(r.value)&&trySolution(def,r.value)){probe.dispose();done(r.value);return;}}}catch(e){try{probe.dispose();}catch(_){}done(null);return;}
    setTimeout(chunk,0);})();
}

  const stage=document.getElementById('stage');
  stage.addEventListener('dragover',e=>{if(EDI.isOpen)e.preventDefault();});
  stage.addEventListener('drop',e=>{if(!EDI.isOpen)return;e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(!LIB[t])return;const r=cv.getBoundingClientRect();EDI.addObj(t,(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
})();

/* =====================================================================
   SECTION 18 - MAIN GAME LOOP
   ===================================================================== */
let probe=null;
function resize(){
  const ed=document.getElementById('ed'),open=ed&&ed.style.display==='block',edw=open?320:0,aw=Math.max(200,window.innerWidth-edw),ah=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,3);
  VH=open?H:clamp(Math.round(W*ah/aw),H,1728);OY=VH-H;const s=Math.min(aw/W,ah/VH);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(VH*s)+'px';cv.width=Math.max(1,Math.round(W*s*dpr));cv.height=Math.max(1,Math.round(VH*s*dpr));VK=cv.width/W;
  if(!probe){probe=document.createElement('div');probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';document.body.appendChild(probe);}
  const cs=getComputedStyle(probe);SAT=(parseFloat(cs.paddingTop)||0)/s;SAB=(parseFloat(cs.paddingBottom)||0)/s;
  document.getElementById('stage').style.right=edw+'px';
}
function update(dt){
  G.t+=dt;
  if(G.trans){G.trans.p+=dt*4.5;if(G.trans.p>=1&&!G.trans.sw){G.trans.sw=true;enter(G.trans.to);}if(G.trans.p>=2)G.trans=null;}
  G.ovT+=dt;
  if(G.screen==='play'&&G.scene){
    const sc=G.scene;
    if(!G.ov||G.ov==='win')sc.step(dt*1000);
    if(!G.ov&&sc.state==='running')AU.setRoll(sc.bs.contact>0?clamp(sc.bs.spd/700,0,1):0);else AU.setRoll(0);
    if(G.tipT>0&&sc.state==='ready'&&!G.drawing)G.tipT-=dt;
    if(G.hint>0)G.hint-=dt;if(G.msg)G.msg.t-=dt;
    if(G.pending){G.pending.t-=dt;if(G.pending.t<=0){G.ov=G.pending.type;G.ovT=0;G.starSfx=0;G.pending=null;}}
  }else AU.setRoll(0);
  if(G.screen==='editor'&&EDI.dirty)EDI.rebuild();
  updateP(dt);
  for(const t of G.toasts)t.t+=dt;if(G.toasts.length&&G.toasts[0].t>3.5)G.toasts.shift();
}
function render(){
  const c=ctx;c.setTransform(VK,0,0,VK,0,0);c.clearRect(0,0,W,VH);UI.begin();
  if(G.boot){drawBoot(c);return;}
  const ctr=Math.max(OY/2,Math.min(SAT,OY)),top=Math.min(SAT,OY);
  switch(G.screen){
    case 'menu':at(c,ctr,()=>drawMenu(c));at(c,top,()=>drawMenuTop(c));at(c,OY-Math.min(SAB,OY),()=>drawMenuBottom(c));break;case 'levels':at(c,top,()=>drawLevels(c));break;case 'chars':at(c,ctr,()=>drawChars(c));break;case 'ach':at(c,ctr,()=>drawAch(c));break;
    case 'settings':at(c,ctr,()=>drawSettings(c));break;case 'play':if(G.scene)drawPlay(c);break;case 'editor':EDI.draw(c);break;
  }
  at(c,top,()=>drawToasts(c));if(G.confirm)at(c,ctr,()=>drawConfirm(c));
  if(G.trans){const a=G.trans.p<1?G.trans.p:2-G.trans.p;c.fillStyle='rgba(226,243,255,'+clamp(a,0,1)+')';c.fillRect(0,0,W,VH);}
}
let lastTs=performance.now();
function frame(ts){
  if(G.ytPaused)return;
  const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  try{update(dt);render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
function ytPause(){if(G.ytPaused)return;G.ytPaused=true;if(G.screen==='play'&&G.scene&&!G.ov&&G.scene.state==='running'){G.ov='pause';G.ovT=0;}AU.setRoll(0);try{if(AU.ctx&&AU.ctx.suspend)AU.ctx.suspend();}catch(e){}flushCloud();}
function ytResume(){if(!G.ytPaused)return;G.ytPaused=false;lastTs=performance.now();try{if(AU.ctx&&YT_AUDIO&&AU.ctx.resume)AU.ctx.resume();}catch(e){}requestAnimationFrame(frame);}
if(YT){try{YT_AUDIO=!!ytgame.system.isAudioEnabled();ytgame.system.onAudioEnabledChange(on=>{YT_AUDIO=!!on;AU.applyVol();try{if(AU.ctx){if(on&&!G.ytPaused)AU.ctx.resume();else AU.ctx.suspend();}}catch(e){}});ytgame.system.onPause(ytPause);ytgame.system.onResume(ytResume);}catch(e){}
  window.addEventListener('error',()=>{try{ytgame.health.logError();}catch(e){}});}
window.EmojiDrop=Object.assign(window.EmojiDrop||{},{levels:LEVELS,validateAll,validateDef,simulate,save:()=>SAVE,openEditor:()=>go('editor')});
if(LEVELS.length!==200)console.warn('Expected 200 levels, found '+LEVELS.length);
resize();G.boot=true;requestAnimationFrame(frame);
setTimeout(()=>{if(YT)try{ytgame.game.firstFrameReady();}catch(e){}
  const done=()=>{CLOUD_OK=true;G.boot=false;AU.applyVol();checkProgress();setTimeout(()=>{if(YT)try{ytgame.game.gameReady();}catch(e){}},120);const gm=!YT&&/^#gen-(\d+)-(\d+)$/.exec(location.hash||'');if(gm)runGenHints(Math.max(1,+gm[1]),Math.min(+gm[2],LEVELS.length));};
  if(YT){try{ytgame.game.loadData().then(raw=>{try{if(raw)SAVE=loadSave(raw);}catch(e){}done();}).catch(done);}catch(e){done();}}else done();},80);
if(!YT&&/[?&]dev\b/.test(location.search))setTimeout(()=>go('editor'),300);
})();
</script>
